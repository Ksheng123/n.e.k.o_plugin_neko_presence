name: verify

# 用官方标准校验工作流（市场按它判断这个提交能不能发）。
#
# plugin-directory 留空 = 插件就在仓库根目录。本仓库不是 N.E.K.O 源码树，
# 整个仓库就是 neko_presence/ 这一层；官方工作流会把它挂到
# plugin/plugins/<id>/ 下再跑，所以路径不用我们自己搬。
#
# 它做的事：ruff → sync 依赖 → CLI `check -r`（含打包）→ 写 market-evidence.json。
# 注意 CLI 用的是**官方打包逻辑**，不是本仓库 tools/build_package.py。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: Project-N-E-K-O/N.E.K.O/.github/workflows/plugin-market-verify.yml@main
    with:
      plugin-id: neko_presence
      plugin-directory: ""
      neko-repository: Project-N-E-K-O/N.E.K.O
      neko-ref: main
