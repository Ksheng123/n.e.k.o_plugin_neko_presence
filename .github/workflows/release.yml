name: release

# 用官方标准发布工作流：打 v* 标签 → 出包 → 写 market-evidence.json →
# 建 GitHub Release（三个资产）→ 市场才能读到这个版本。
#
# 为什么不能自己写：Market 只认标准发布验证成功的 Release，并且要
# <id>.neko-plugin、<id>.market-release-check.txt、market-evidence.json
# 三件套。自建 workflow 拿不到后两样，发了也没有可安装版本。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: Project-N-E-K-O/N.E.K.O/.github/workflows/plugin-market-release.yml@main
    with:
      plugin-id: neko_presence
      plugin-directory: ""
      neko-repository: Project-N-E-K-O/N.E.K.O
      neko-ref: main
